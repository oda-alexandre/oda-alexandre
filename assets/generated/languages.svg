<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-label="Most used languages">
  <defs><filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.6"/></filter><linearGradient id="languageBarFill" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#116466" stop-opacity="0.98"/><stop offset="55%" stop-color="#116466" stop-opacity="0.86"/><stop offset="100%" stop-color="#116466" stop-opacity="0.52"/></linearGradient></defs>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.card-title { fill: #24292f; font-size: 15px; font-weight: 600; }
.card-description { fill: #57606a; font-size: 13px; font-weight: 400; }
.metric-value { fill: #24292f; font-size: 30px; font-weight: 700; }
.metric-label { fill: #57606a; font-size: 13px; font-weight: 400; }
.status-value { fill: #24292f; font-size: 17px; font-weight: 600; }
.data-label { fill: #24292f; font-size: 15px; font-weight: 600; }
.data-meta { fill: #57606a; font-size: 13px; font-weight: 400; }
.activity-axis { fill: #57606a; font-size: 11px; font-weight: 400; }
.meta { fill: #57606a; font-size: 11px; font-weight: 400; }
.theme-text { fill: #24292f; }
.theme-track { fill: #d0d7de; }
.activity-none { fill: #d0d7de; }
.activity-first { fill: #bcd4d4; }
.activity-second { fill: #8db5b6; }
.activity-third { fill: #548f91; }
.activity-fourth { fill: #116466; }
@media (prefers-color-scheme: dark) {
  .card-title, .metric-value, .status-value, .data-label, .theme-text { fill: #f0f6fc; }
  .card-description, .metric-label, .data-meta, .meta, .activity-axis { fill: #8b949e; }
  .theme-track { fill: #21262d; }
  .activity-none { fill: #21262d; }
  .activity-first { fill: #0e282d; }
  .activity-second { fill: #0f393d; }
  .activity-third { fill: #104d50; }
  .activity-fourth { fill: #116466; }
}
.action-label { fill: #116466; font-size: 10px; font-weight: 700; letter-spacing: 0.65px; }
.connector-label { fill: #116466; font-size: 10.0px; font-weight: 700; letter-spacing: 0.50px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }</style>
