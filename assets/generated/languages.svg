  <text class="data-label" x="30" y="122">Python</text><text class="data-meta" x="690" y="122" text-anchor="end">100.0%</text><rect x="30" y="132" width="570.0" height="7" rx="3.5" class="theme-track" fill-opacity="0.42"/><rect x="30" y="132" width="570.0" height="7" rx="3.5" fill="url(#languageBarFill)" opacity="1.00"/><rect x="31.0" y="133.0" width="568.0" height="1.6" rx="0.8" class="theme-text" fill-opacity="0.18"/>
