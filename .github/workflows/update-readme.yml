name: Publish Profile README

# GitHub dev is a technical mirror of canonical GitLab dev. Profile publication
# runs when that mirrored branch advances; release tags are mirrored separately
# and do not trigger a redundant README publication.
on:
  push:
    branches:
      - dev
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      profile_health_test:
        description: "Optional Profile Health self-test; use none for a normal manual publication"
        required: true
        default: none
        type: choice
        options:
          - none
          - incident-a
          - incident-b
          - recovery

# The workflow needs only read access to repository contents. Publication to
# main uses the dedicated SSH deploy key, while Profile Health is centralized in
# GitLab through a separate least-privilege service-account token.
permissions:
  contents: read

concurrency:
  group: publish-profile-readme
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.profile_health_test == 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prepare_outcome: ${{ steps.publish.outcome }}
      generate_outcome: ${{ steps.profile.outcome }}
      verify_outcome: ${{ steps.verify.outcome }}
      commit_outcome: ${{ steps.commit.outcome }}
      health_report_b64: ${{ steps.capture_health.outputs.report_b64 }}

    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          # Repository contents are public and only require read access here.
          # Publication uses a dedicated SSH deploy key instead of checkout's
          # GITHUB_TOKEN credentials.
          persist-credentials: false

      - name: Prepare published branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_DIR="$RUNNER_TEMP/profile-publish"
          echo "dir=$PUBLISH_DIR" >> "$GITHUB_OUTPUT"

          git fetch origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/dev:refs/remotes/origin/dev'
          rm -rf "$PUBLISH_DIR"
          git worktree add --detach "$PUBLISH_DIR" origin/main
          git -C "$PUBLISH_DIR" config user.name "github-actions[bot]"
          git -C "$PUBLISH_DIR" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve dev as the editable source and main as the filtered published
          # snapshot, while still making every source commit reachable from the
          # default branch. The ours strategy records origin/dev as a second parent
          # without copying source-only files into main. The rsync below then builds
          # the exact public tree for the resulting publication commit. Existing dev
          # commits are never rebased, squashed, or recreated, so their commit IDs,
          # authorship, and signatures remain intact.
          if ! git -C "$PUBLISH_DIR" merge-base --is-ancestor origin/dev HEAD; then
            git -C "$PUBLISH_DIR" merge --no-commit --no-ff -s ours origin/dev
          fi

          # The workflow itself is synchronized to main so scheduled runs always
          # use the latest source definition. Template/config stay source-only.
          rm -f \
            "$PUBLISH_DIR/README.template" \
            "$PUBLISH_DIR/profile.config.toml"

          rsync -a --delete \
            --exclude '.git' \
            --exclude 'README.md' \
            --exclude 'README.template' \
            --exclude 'profile.config.toml' \
            --exclude 'assets/generated/' \
            ./ "$PUBLISH_DIR"/

      - name: Generate published README and assets
        id: profile
        if: steps.publish.outcome == 'success'
        working-directory: ${{ steps.publish.outputs.dir }}
        env:
          PROFILE_FORGE: github
          GH_TOKEN: ${{ github.token }}
          # External-platform secrets are injected only at generation time and
          # are never copied into the published branch or README.
          HTB_TOKEN: ${{ secrets.HTB_TOKEN }}
          HACKERONE_API_TOKEN: ${{ secrets.HACKERONE_API_TOKEN }}
          README_TEMPLATE: ${{ github.workspace }}/README.template
          PROFILE_CONFIG: ${{ github.workspace }}/profile.config.toml
          PROFILE_HEALTH_FILE: ${{ runner.temp }}/profile-health.json
        run: python3 scripts/update_readme.py

      - name: Capture profile health report
        id: capture_health
        if: always()
        shell: bash
        env:
          PROFILE_HEALTH_FILE: ${{ runner.temp }}/profile-health.json
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path(os.environ["PROFILE_HEALTH_FILE"])
          encoded = base64.b64encode(path.read_bytes()).decode("ascii") if path.is_file() else ""
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"report_b64={encoded}\n")
          PY

      - name: Verify published snapshot
        id: verify
        if: steps.profile.outcome == 'success'
        working-directory: ${{ steps.publish.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test ! -e README.template
          test ! -e profile.config.toml
          test -f assets/separator.gif
          test -f assets/badges/contact/website.svg
          test -f assets/badges/contact/linkedin.svg
          test -f assets/badges/contact/github.svg
          test -f assets/badges/contact/gitlab.svg
          test -f assets/badges/contact/gpg-public-key.svg
          # The README footer links to these repository-relative files. Keep the
          # publication invariant explicit so broken licensing links fail early.
          test -f LICENSE
          test -f NOTICE

          python3 - <<'PY'
          from pathlib import Path
          import re

          readme = Path("README.md").read_text(encoding="utf-8")
          references = set(
              re.findall(r'\./assets/generated/([^?\"\')]+\.svg)', readme)
          )
          missing = sorted(
              name for name in references
              if not (Path("assets/generated") / name).is_file()
          )
          if missing:
              raise SystemExit(
                  "README references missing generated assets: " + ", ".join(missing)
              )
          if "temporarily unavailable" in readme.lower():
              raise SystemExit("Public README contains an internal availability placeholder")
          PY

      - name: Commit published profile
        id: commit
        if: steps.verify.outcome == 'success'
        working-directory: ${{ steps.publish.outputs.dir }}
        shell: bash
        env:
          # The private publication key is stored as a repository secret. The
          # expected GitHub host fingerprint is non-secret configuration stored
          # as a repository variable so it can be rotated without editing YAML.
          GH_PUBLISH_SSH_KEY: ${{ secrets.GH_PUBLISH_SSH_KEY }}
          GH_SSH_HOST_FINGERPRINT: ${{ vars.GH_SSH_HOST_FINGERPRINT }}
          GH_PUBLISH_URL: git@github.com:${{ github.repository }}.git
        run: |
          set -euo pipefail

          if [ -z "${GH_PUBLISH_SSH_KEY:-}" ]; then
            echo "::error::GH_PUBLISH_SSH_KEY is required for publication."
            exit 1
          fi

          git add -A
          # Generated SVGs are intentionally ignored on dev/source but are part
          # of the published main snapshot, so they must remain force-added.
          git add -f README.md assets/generated/

          MERGE_HEAD_PATH="$(git rev-parse --git-path MERGE_HEAD)"
          if git diff --cached --quiet && [ ! -f "$MERGE_HEAD_PATH" ]; then
            echo "Published profile is already up to date."
          else
            if [ -z "${GH_SSH_HOST_FINGERPRINT:-}" ]; then
              echo "::error::GH_SSH_HOST_FINGERPRINT is required for publication."
              exit 1
            fi

            # When origin/dev contains new source commits, MERGE_HEAD makes this a
            # two-parent publication commit: previous main + current dev. This keeps
            # dev history reachable from the default branch without publishing the
            # source-only dev tree. If dev is already an ancestor, this is a normal
            # single-parent snapshot refresh.
            git commit -m "chore(readme): publish profile"
            git merge-base --is-ancestor origin/dev HEAD

            SSH_KEY_PATH="$RUNNER_TEMP/github-publish-ed25519"
            KNOWN_HOSTS_PATH="$RUNNER_TEMP/github-known-hosts"

            cleanup_publish_credentials() {
              rm -f "$SSH_KEY_PATH" "$KNOWN_HOSTS_PATH"
            }
            trap cleanup_publish_credentials EXIT

            # The dedicated GitHub publication deploy key exists only for the
            # lifetime of this ephemeral runner.
            printf '%s\n' "$GH_PUBLISH_SSH_KEY" \
              | tr -d '\r' > "$SSH_KEY_PATH"
            chmod 600 "$SSH_KEY_PATH"

            # Fail before attempting the push if the stored secret is not a valid
            # OpenSSH private key.
            ssh-keygen -y -f "$SSH_KEY_PATH" >/dev/null

            # Retrieve GitHub.com's Ed25519 host key, then trust it only if its
            # SHA-256 fingerprint matches the pinned repository variable.
            ssh-keyscan \
              -T 10 \
              -t ed25519 \
              github.com \
              > "$KNOWN_HOSTS_PATH" \
              2>/dev/null

            test -s "$KNOWN_HOSTS_PATH"

            ACTUAL_FINGERPRINTS="$(
              ssh-keygen -lf "$KNOWN_HOSTS_PATH" -E sha256 \
                | awk '{print $2}' \
                | sort -u
            )"

            if [ "$ACTUAL_FINGERPRINTS" != "$GH_SSH_HOST_FINGERPRINT" ]; then
              echo "::error::GitHub SSH host key fingerprint validation failed."
              echo "::error::Expected: $GH_SSH_HOST_FINGERPRINT"
              echo "::error::Received: $ACTUAL_FINGERPRINTS"
              exit 1
            fi

            chmod 600 "$KNOWN_HOSTS_PATH"

            export GIT_SSH_COMMAND="ssh -i $SSH_KEY_PATH -o IdentitiesOnly=yes -o IdentityAgent=none -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS_PATH"

            # main is published exclusively through the dedicated write-enabled
            # GitHub deploy key; GITHUB_TOKEN retains contents:read only.
            git push "$GH_PUBLISH_URL" HEAD:main
          fi

      - name: Remove publish worktree
        if: always()
        shell: bash
        env:
          PUBLISH_DIR: ${{ steps.publish.outputs.dir }}
        run: |
          if [ -n "${PUBLISH_DIR:-}" ] && [ -d "$PUBLISH_DIR" ]; then
            git worktree remove "$PUBLISH_DIR" --force || true
          fi


  report_profile_health:
    name: Report profile health to GitLab
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout health reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false

      - name: Restore generator health report
        shell: bash
        env:
          PROFILE_HEALTH_REPORT_B64: ${{ needs.publish.outputs.health_report_b64 }}
          PROFILE_HEALTH_FILE: ${{ runner.temp }}/profile-health.json
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ.get("PROFILE_HEALTH_REPORT_B64", "").strip()
          if encoded:
              Path(os.environ["PROFILE_HEALTH_FILE"]).write_bytes(
                  base64.b64decode(encoded, validate=True)
              )
          PY

      - name: Report GitHub health to GitLab
        shell: bash
        env:
          PROFILE_HEALTH_FORGE: github
          PROFILE_HEALTH_FILE: ${{ runner.temp }}/profile-health.json
          PROFILE_HEALTH_TEST_CASE: ${{ inputs.profile_health_test || 'none' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PROFILE_WORKFLOW_OUTCOME: ${{ needs.publish.result }}
          PROFILE_PREPARE_OUTCOME: ${{ needs.publish.outputs.prepare_outcome }}
          PROFILE_GENERATE_OUTCOME: ${{ needs.publish.outputs.generate_outcome }}
          PROFILE_VERIFY_OUTCOME: ${{ needs.publish.outputs.verify_outcome }}
          PROFILE_COMMIT_OUTCOME: ${{ needs.publish.outputs.commit_outcome }}
          GITLAB_PROFILE_HEALTH_TOKEN: ${{ secrets.GITLAB_PROFILE_HEALTH_TOKEN }}
          GITLAB_PROFILE_HEALTH_API_URL: https://gitlab.com/api/v4
          GITLAB_PROFILE_HEALTH_PROJECT: oda-alexandre/oda-alexandre
        run: python3 scripts/report_profile_health.py
