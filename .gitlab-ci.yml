#       variables:
#         RUNNER_ROUTING_TAG: "oda-alexandre-gitlab-runner"

#     # Release tags are canonical source refs and pass the same cryptographic gate.
#     - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v/'
#       variables:
#         RUNNER_ROUTING_TAG: "oda-alexandre-gitlab-runner"

#     # Manual Profile Health self-tests are isolated from publication/source jobs
#     # and run only on GitLab-hosted compute.
