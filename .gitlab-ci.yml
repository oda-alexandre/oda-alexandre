spec:
  inputs:
    profile_health_test:
      description: 'Optional Profile Health self-test for a manual pipeline'
      type: string
      default: 'none'
      options:
        - 'none'
        - 'incident-a'
        - 'incident-b'
        - 'recovery'
---
